# Login rate limit for roundcube-ai-backend. Copy this file to
# /etc/nginx/conf.d/. Debian includes that directory in the http block.
# nginx-location.conf uses the zone "rcai_login". Without this file,
# nginx refuses to start with: zero size shared memory zone "rcai_login".
#
# Only do_login requests get a key. Requests with an empty key have no limit.
map $arg_fn $rcai_login_key {
    do_login  $binary_remote_addr;
    default   "";
}
limit_req_zone $rcai_login_key zone=rcai_login:1m rate=10r/m;
