# Install deploy/nginx-rcai-limit.conf in /etc/nginx/conf.d/ first. It
# defines the zone rcai_login that the limit_req line below uses.
#
# Copy this file to /etc/nginx/snippets/roundcube-ai-backend.conf, and add
# "include snippets/roundcube-ai-backend.conf;" to the server block of your
# Roundcube webmail, e.g. webmail.example.com.
# On the same host name as the webmail, a Content Security Policy with
# connect-src 'self' allows the chat, and the browser needs no CORS.
# The backend accepts the path with the /rcapi prefix, so proxy_pass has no
# path part. Set [server] base_path = "/rcapi" in config.toml.
# To use a random sub-URL instead of /rcapi, read docs/install.md, section 7.
location /rcapi/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The chat is a server-sent event stream that can last minutes.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # At most 10 login requests per minute from one address, with a burst of 5.
    limit_req zone=rcai_login burst=5 nodelay;
    limit_req_status 429;

    # The browser sends the whole visible conversation with each request.
    # The backend refuses bodies over [server] max_body_bytes (2 MB) too.
    client_max_body_size 2m;
}
