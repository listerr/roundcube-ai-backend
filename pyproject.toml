[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roundcube-ai-backend"
version = "0.1.0"
description = "Backend for the Roundcube ai_agent plugin, with OpenAI and Dovecot IMAP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Rob Lister", email = "robl-dev@lentil.org" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "imapclient>=3.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
roundcube-ai-backend = "rcai.server:main"
roundcube-ai-admin = "rcai.admin:main"

[tool.setuptools]
packages = ["rcai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
